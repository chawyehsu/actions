name: Semantic PR Title
description: Validate that PR titles follow the Conventional Commits specification
author: Chawye Hsu
branding:
  icon: check-circle
  color: green

inputs:
  types:
    description: Allowed commit types (comma separated)
    required: false
    default: "feat,fix,docs,style,refactor,perf,test,build,ci,chore,revert"

runs:
  using: composite
  steps:
    - name: Validate PR title
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        PR_TITLE: ${{ github.event.pull_request.title }}
        TYPES: ${{ inputs.types }}
      run: |
        set -euo pipefail

        if [ "$EVENT_NAME" != "pull_request" ]; then
          echo "This action only works on pull_request events, skipping."
          exit 0
        fi

        # Build regex from allowed types
        types_pattern=$(printf '%s' "$TYPES" | tr ',' '|')
        re="^\b(${types_pattern})\b(\([^)]+\))?!?:\s.+"

        if ! printf '%s' "$PR_TITLE" | grep -qE "$re"; then
          echo "::error::PR title does not follow Conventional Commits format."
          echo ""
          echo "Expected format: <type>(<scope>): <subject>"
          echo ""
          echo "Allowed types: ${types_pattern}"
          echo "Examples:"
          echo "  feat: add new feature"
          echo "  fix(api): resolve timeout issue"
          echo "  feat!: breaking change"
          echo ""
          echo "Got: \"${PR_TITLE}\""
          exit 1
        fi

        echo "PR title is valid: \"${PR_TITLE}\""
